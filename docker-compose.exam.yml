# Compose para el examen final (QA) - Sprint 5.
# Usa las imagenes precompiladas de la API y la UI, pero construye localmente
# el servidor web (nginx) porque la imagen publicada "practice-software-testing-web"
# solo existe para arquitectura arm64 y falla en equipos x86_64 (Windows/Linux Intel/AMD).
# Se omite el servicio "cron" (opcional, tambien solo arm64).
name: pst
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      - "PHP_OPCACHE_VALIDATE_TIMESTAMPS=1"
      - "DB_PORT=3306"
      - "DB_HOST=mariadb"
      - "host=localhost"
      - DISABLE_LOGGING=false
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports:
      - 4200:4200
    command: >
      bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    build:
      context: ./_docker
      dockerfile: web.docker
    ports:
      - 8091:80
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
